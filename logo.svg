<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <!-- kalem ucundaki yarık ve nefes deliği -->
    <mask id="slit">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="256" cy="246" r="15" fill="#000"/>
      <rect x="250" y="246" width="12" height="132" fill="#000"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- ses dalgaları -->
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <path d="M160 178 A112 112 0 0 0 160 302" stroke-width="22" opacity="0.95"/>
    <path d="M352 178 A112 112 0 0 1 352 302" stroke-width="22" opacity="0.95"/>
    <path d="M114 142 A168 168 0 0 0 114 338" stroke-width="20" opacity="0.55"/>
    <path d="M398 142 A168 168 0 0 1 398 338" stroke-width="20" opacity="0.55"/>
  </g>

  <!-- kalem ucu -->
  <rect x="214" y="104" width="84" height="40" rx="12" fill="#fff" opacity="0.9"/>
  <path d="M256 404 L202 262 Q192 206 222 152 L290 152 Q320 206 310 262 Z" fill="url(#nib)" mask="url(#slit)"/>

  <!-- mürekkep dalgası -->
  <path d="M150 432 q 26.5 -26 53 0 t 53 0 t 53 0 t 53 0" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round"/>
</svg>
